[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter-critique-cli"
version = "0.1.0"
description = "Manuscript-first-draft helper: structured chapter critique from any OpenAI-compatible endpoint (no API keys)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["writing", "critique", "ollama", "llm", "manuscript", "fiction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
]
dependencies = []

[project.scripts]
chapter-critique = "chapter_critique.cli:main"

[tool.setuptools.packages.find]
include = ["chapter_critique*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
